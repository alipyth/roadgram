[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roadgram"
version = "0.2.0"
description = "Publish a Markdown roadmap and weekly plan to a Telegram group: progress bars, client approval buttons, milestone invoices and fully automatic sync."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
roadgram = "roadgram.cli:main"

[tool.setuptools]
packages = ["roadgram"]

[project.urls]
Homepage = "https://github.com/alipyth/roadgram"
Issues = "https://github.com/alipyth/roadgram/issues"
